# spec.md (Завдання 4): every commit on main whose CI is green is deployed to staging.
# No SSH and no database access from here: Actions publishes the image to GHCR and calls Render's
# deploy hook over HTTPS; Render pulls the image, the container migrates its own database on start,
# and traffic moves to it only when /readyz is 200 (until then the previous version keeps serving).
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vv_audio

jobs:
  deploy-staging:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push the image (tagged with the commit SHA)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ env.SHA }}
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ask Render to deploy this exact image
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -fsS -X POST --get "$HOOK" --data-urlencode "imgURL=${IMAGE}:${SHA}" -o /dev/null
          echo "deploy requested for ${IMAGE}:${SHA}"

      - name: wait until staging /version reports this commit
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          for i in $(seq 1 60); do
            got=$(curl -fsS --max-time 20 "$STAGING_URL/version" | jq -r .sha || true)
            echo "attempt $i: staging runs ${got:-nothing yet}"
            if [ "$got" = "$SHA" ]; then
              echo "staging is on $SHA"
              exit 0
            fi
            sleep 15
          done
          echo "staging did not switch to $SHA in 15 minutes"
          exit 1
